name: Bootstrap physics laboratory

on:
  push:
    branches:
      - feature/laboratorium-fizyki
    paths:
      - '.github/workflows/physics-lab-bootstrap.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct source files
        shell: bash
        run: |
          set -euo pipefail
          cat .physics-lab-bootstrap/chunk-* > /tmp/physics-lab-payload.b64
          base64 --decode /tmp/physics-lab-payload.b64 > /tmp/physics-lab-payload.tar.gz
          echo "f84fac482a27b47300f43381df0df50e7d13376ff859f1a2863ebfdf15e137b5  /tmp/physics-lab-payload.tar.gz" | sha256sum --check -
          tar -xzf /tmp/physics-lab-payload.tar.gz -C .
      - name: Validate catalog
        run: node --experimental-strip-types --test tests/unit/physics-lab-catalog.test.ts
      - name: Commit reconstructed application
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .physics-lab-bootstrap
          rm -f .github/workflows/physics-lab-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add interactive physics laboratory"
          git push origin HEAD:feature/laboratorium-fizyki
