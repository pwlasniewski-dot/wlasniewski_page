name: Package promotions production smoke

on:
  push:
    branches:
      - qa/package-promotions-production-smoke-20260901

permissions:
  contents: write

jobs:
  production-smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/package-promotions-production-smoke-20260901
          fetch-depth: 0

      - name: Wait for the promoted release fingerprint
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/last-api-error.log

          for attempt in $(seq 1 40); do
            cache_buster="$(date +%s)-${attempt}"
            echo "Production fingerprint attempt ${attempt}/40"

            http_code="$(curl -L --silent --show-error \
              --connect-timeout 10 --max-time 40 \
              -H 'Cache-Control: no-cache, no-store' \
              -H 'Pragma: no-cache' \
              -o /tmp/service-types.json \
              -w '%{http_code}' \
              "https://wlasniewski.pl/api/service-types?rollout_qa=${cache_buster}" || true)"

            if [ "$http_code" = "200" ]; then
              if python3 - <<'PY' 2>/tmp/last-api-error.log
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/service-types.json').read_text(encoding='utf-8'))
          assert data.get('success') is True, 'API success flag is not true'
          services = data.get('serviceTypes')
          assert isinstance(services, list) and services, 'No services returned'
          packages = [pkg for service in services for pkg in (service.get('packages') or [])]
          assert packages, 'No booking packages returned'

          missing = []
          for pkg in packages:
              for key in ('regular_price', 'effective_price', 'promotion'):
                  if key not in pkg:
                      missing.append(f"package {pkg.get('id')}: {key}")
          assert not missing, 'New release fingerprint missing: ' + ', '.join(missing[:10])

          active = [pkg.get('id') for pkg in packages if pkg.get('promotion') is not None]
          assert not active, f'Unexpected active promotions: {active}'

          mismatched = [
              pkg.get('id') for pkg in packages
              if pkg.get('price') != pkg.get('regular_price')
              or pkg.get('effective_price') != pkg.get('regular_price')
          ]
          assert not mismatched, f'Price changed despite zero active promotions: {mismatched}'

          Path('/tmp/package-count.txt').write_text(str(len(packages)), encoding='utf-8')
          PY
              then
                echo "Production API contains the new promotion contract."
                break
              fi
            else
              echo "API returned HTTP ${http_code}."
            fi

            if [ "$attempt" = "40" ]; then
              echo "Production did not expose the expected release fingerprint in time."
              cat /tmp/last-api-error.log || true
              cat /tmp/service-types.json || true
              exit 1
            fi
            sleep 15
          done

      - name: Verify public and protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          cache_buster="$(date +%s)"

          check_200() {
            local url="$1"
            local name="$2"
            local output="$3"
            local status
            status="$(curl -L --silent --show-error \
              --connect-timeout 10 --max-time 50 \
              -H 'Cache-Control: no-cache, no-store' \
              -o "$output" -w '%{http_code}' "${url}?rollout_qa=${cache_buster}")"
            if [ "$status" != "200" ]; then
              echo "${name} returned HTTP ${status}."
              exit 1
            fi
            if [ ! -s "$output" ]; then
              echo "${name} returned an empty body."
              exit 1
            fi
            echo "${name}: HTTP 200"
          }

          check_200 'https://wlasniewski.pl/' 'Homepage' '/tmp/home.html'
          check_200 'https://wlasniewski.pl/rezerwacja' 'Booking page' '/tmp/booking.html'
          check_200 'https://wlasniewski.pl/admin/promocje' 'Promotion admin route' '/tmp/admin-promotions.html'

          protected_status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 40 \
            -H 'Cache-Control: no-cache, no-store' \
            -o /tmp/admin-api.json -w '%{http_code}' \
            "https://wlasniewski.pl/api/admin/package-promotions?rollout_qa=${cache_buster}")"
          case "$protected_status" in
            401|403) echo "Promotion admin API is present and protected: HTTP ${protected_status}" ;;
            *)
              echo "Expected protected promotion admin API to return 401/403, got ${protected_status}."
              cat /tmp/admin-api.json || true
              exit 1
              ;;
          esac

          if grep -qiE 'Application error|Internal Server Error|Bad Gateway|Service Unavailable' /tmp/home.html /tmp/booking.html; then
            echo 'A public page contains an application/server error marker.'
            exit 1
          fi

      - name: Publish verification summary
        shell: bash
        run: |
          packages="$(cat /tmp/package-count.txt)"
          {
            echo '## Package promotions — production smoke PASS'
            echo
            echo "- Production API exposes the package-promotion contract for **${packages} packages**."
            echo '- All package promotions are disabled.'
            echo '- Public and effective prices equal the existing regular prices.'
            echo '- Homepage: HTTP 200.'
            echo '- Booking page: HTTP 200.'
            echo '- Promotion admin route: HTTP 200.'
            echo '- Promotion admin API exists and rejects unauthenticated access.'
            echo '- No booking or payment was created during this test.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the one-time QA workflow
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/package-promotions-production-smoke.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove completed production smoke workflow'
          git push origin HEAD:qa/package-promotions-production-smoke-20260901
