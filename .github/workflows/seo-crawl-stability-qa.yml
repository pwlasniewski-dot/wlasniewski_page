name: SEO crawl stability QA

on:
  push:
    branches:
      - fix/seo-crawl-stability

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_database?schema=public

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/seo-crawl-stability

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and generate Prisma client
        run: |
          npm ci
          npx prisma generate

      - name: Run targeted sitemap and middleware tests
        run: |
          node --import tsx --test tests/unit/sitemap-crawl-stability.test.ts
          node --import tsx --test tests/unit/aeroanaliza-middleware.test.ts

      - name: Verify TypeScript on changed surfaces
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
          status=${PIPESTATUS[0]}
          set -e
          TYPECHECK_STATUS="$status" python3 - <<'PY'
          import os
          import re
          import sys

          changed = {
              'src/app/sitemap.ts',
              'src/lib/seo/sitemapUrl.ts',
              'tests/unit/sitemap-crawl-stability.test.ts',
          }
          pattern = re.compile(r'^(.+?)\(\d+,\d+\): error TS\d+:')
          feature_errors = []
          with open('/tmp/typecheck.log', encoding='utf-8', errors='replace') as handle:
              for line in handle:
                  match = pattern.match(line)
                  if match and match.group(1) in changed:
                      feature_errors.append(line.rstrip())

          print(f'Global typecheck exit: {os.environ.get("TYPECHECK_STATUS", "unknown")}')
          if feature_errors:
              print('\n'.join(feature_errors))
              sys.exit(1)
          print('No TypeScript diagnostics in changed sitemap surfaces.')
          PY

      - name: Verify source tree cleanliness
        run: git diff --check
