name: SEO crawl preview QA

on:
  push:
    branches:
      - fix/seo-crawl-stability

permissions:
  contents: read

jobs:
  preview-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_URL: https://deploy-preview-64--helpful-axolotl-cc1cbb.netlify.app
      AHREFS_UA: Mozilla/5.0 (compatible; AhrefsBot/7.0; +http://ahrefs.com/robot/)

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/seo-crawl-stability

      - name: Wait for new sitemap fingerprint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 50); do
            status="$(curl -L --silent --show-error \
              --connect-timeout 10 --max-time 45 \
              -A "$AHREFS_UA" \
              -D /tmp/sitemap.headers \
              -o /tmp/sitemap.xml \
              -w '%{http_code}' \
              "$PREVIEW_URL/sitemap.xml?qa=${GITHUB_SHA}-${attempt}" || true)"

            if [ "$status" = "200" ] \
              && grep -q 'Sesja%20Rodzinna' /tmp/sitemap.xml \
              && grep -qi 'stale-while-revalidate=604800' /tmp/sitemap.headers; then
              echo "Latest preview sitemap is available."
              break
            fi

            echo "Attempt ${attempt}/50: HTTP ${status}; waiting for latest preview."
            if [ "$attempt" = "50" ]; then
              echo 'Preview did not expose the expected sitemap fingerprint.'
              cat /tmp/sitemap.headers || true
              head -c 2000 /tmp/sitemap.xml || true
              exit 1
            fi
            sleep 15
          done

      - name: Validate sitemap XML and canonical URLs
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlsplit

          xml = Path('/tmp/sitemap.xml').read_bytes()
          root = ET.fromstring(xml)
          urls = [node.text.strip() for node in root.iter() if node.tag.endswith('loc') and node.text]
          assert urls, 'Sitemap contains no URLs'
          assert len(urls) == len(set(urls)), 'Sitemap contains duplicate URLs'

          problems = []
          for url in urls:
              parsed = urlsplit(url)
              if parsed.scheme != 'https' or parsed.netloc != 'wlasniewski.pl':
                  problems.append(f'non-canonical host: {url}')
              if ' ' in url:
                  problems.append(f'literal space: {url}')
              if parsed.fragment:
                  problems.append(f'fragment: {url}')
          assert not problems, '\n'.join(problems)

          session_urls = [url for url in urls if '/portfolio/Sesja%20Rodzinna/' in url]
          assert len(session_urls) >= 2, f'Expected encoded Sesja Rodzinna URLs, found {len(session_urls)}'
          assert all('%2520' not in url for url in session_urls), 'Category was double encoded'
          print(f'Validated {len(urls)} unique canonical URLs; encoded session URLs: {len(session_urls)}.')
          PY

      - name: Verify CDN cache contract and warmed response time
        shell: bash
        run: |
          set -euo pipefail
          grep -i '^cache-control:' /tmp/sitemap.headers
          grep -qi 's-maxage=86400' /tmp/sitemap.headers
          grep -qi 'stale-while-revalidate=604800' /tmp/sitemap.headers
          grep -qi '^content-type: application/xml' /tmp/sitemap.headers

          : > /tmp/timings.txt
          for round in 1 2 3 4 5; do
            curl -L --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              -A "$AHREFS_UA" \
              -o /dev/null \
              -w '%{http_code}\t%{time_starttransfer}\t%{time_total}\n' \
              "$PREVIEW_URL/sitemap.xml" >> /tmp/timings.txt
          done
          cat /tmp/timings.txt

          python3 - <<'PY'
          from pathlib import Path

          rows = []
          for line in Path('/tmp/timings.txt').read_text().splitlines():
              status, ttfb, total = line.split('\t')
              assert status == '200', f'Unexpected HTTP {status}'
              rows.append((float(ttfb), float(total)))
          assert max(ttfb for ttfb, _ in rows) < 5.0, f'Warm sitemap TTFB exceeded 5 s: {rows}'
          print(f'Max warm TTFB: {max(ttfb for ttfb, _ in rows):.3f}s')
          PY
