name: Controlled package promotions migration

on:
  push:
    branches:
      - feat/package-promotions

permissions:
  contents: read

jobs:
  migrate-production-database:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TARGET_MIGRATION: 20260901130000_package_promotions

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/package-promotions
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify protected database secret
        shell: bash
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL repository secret is not configured; no database change was attempted."
            exit 78
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Production migration preflight
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { PrismaClient } from '@prisma/client';

          const target = process.env.TARGET_MIGRATION;
          const connection = new URL(process.env.DATABASE_URL);
          if (!/(^|\.)neon\.tech$/i.test(connection.hostname)) {
            throw new Error('Safety stop: DATABASE_URL does not point to a Neon host.');
          }

          const prisma = new PrismaClient();
          try {
            const [identity] = await prisma.$queryRawUnsafe(`
              SELECT
                current_database() AS database_name,
                current_schema() AS schema_name,
                to_regclass('public.packages')::text AS packages_table,
                to_regclass('public.bookings')::text AS bookings_table,
                to_regclass('public._prisma_migrations')::text AS migrations_table,
                to_regclass('public.package_promotions')::text AS promotions_table,
                to_regclass('public.package_price_history')::text AS price_history_table
            `);

            if (identity.schema_name !== 'public' || !identity.packages_table || !identity.bookings_table) {
              throw new Error('Safety stop: expected production application tables were not found.');
            }
            if (!identity.migrations_table) {
              throw new Error('Safety stop: Prisma migration history table is missing.');
            }

            const [counts] = await prisma.$queryRawUnsafe(`
              SELECT
                COUNT(*)::int AS packages_count,
                COUNT(*) FILTER (WHERE price <= 0)::int AS invalid_package_prices
              FROM "packages"
            `);
            if (counts.packages_count < 1) {
              throw new Error('Safety stop: no booking packages found.');
            }
            if (counts.invalid_package_prices !== 0) {
              throw new Error(`Safety stop: ${counts.invalid_package_prices} packages have a non-positive price.`);
            }

            const appliedRows = await prisma.$queryRawUnsafe(`
              SELECT migration_name
              FROM "_prisma_migrations"
              WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL
            `);
            const applied = new Set(appliedRows.map(row => row.migration_name));
            const local = fs.readdirSync('prisma/migrations', { withFileTypes: true })
              .filter(entry => entry.isDirectory())
              .map(entry => entry.name)
              .sort();
            const pending = local.filter(name => !applied.has(name));

            if (applied.has(target)) {
              if (!identity.promotions_table || !identity.price_history_table) {
                throw new Error('Safety stop: migration is marked as applied but its tables are missing.');
              }
              console.log(`Preflight OK: ${target} is already applied; deploy will be a no-op.`);
            } else {
              if (identity.promotions_table || identity.price_history_table) {
                throw new Error('Safety stop: promotion tables already exist without a completed migration record.');
              }
              if (pending.length !== 1 || pending[0] !== target) {
                throw new Error(`Safety stop: expected only ${target} to be pending; found: ${pending.join(', ') || 'none'}.`);
              }
              console.log(`Preflight OK: exactly one migration is pending: ${target}.`);
            }
            console.log(`Validated ${counts.packages_count} packages; no customer-facing promotion is being activated.`);
          } finally {
            await prisma.$disconnect();
          }
          NODE

      - name: Apply the single verified Prisma migration
        run: npx prisma migrate deploy

      - name: Verify migration and zero-active-promotion state
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { PrismaClient } from '@prisma/client';

          const target = process.env.TARGET_MIGRATION;
          const prisma = new PrismaClient();
          try {
            const [verification] = await prisma.$queryRawUnsafe(`
              SELECT
                (SELECT COUNT(*)::int FROM "_prisma_migrations"
                  WHERE migration_name = $1
                    AND finished_at IS NOT NULL
                    AND rolled_back_at IS NULL) AS completed_migration,
                (SELECT COUNT(*)::int FROM "packages") AS packages_count,
                (SELECT COUNT(*)::int FROM "package_price_history"
                  WHERE valid_to IS NULL) AS open_history_rows,
                (SELECT COUNT(*)::int FROM "package_promotions"
                  WHERE is_enabled = TRUE) AS enabled_promotions,
                (SELECT COUNT(*)::int FROM pg_trigger
                  WHERE tgname = 'packages_record_regular_price_history'
                    AND NOT tgisinternal) AS trigger_count
            `, target);

            const failures = [];
            if (verification.completed_migration !== 1) failures.push('migration record');
            if (verification.packages_count !== verification.open_history_rows) failures.push('price-history baseline');
            if (verification.enabled_promotions !== 0) failures.push('unexpected active promotion');
            if (verification.trigger_count !== 1) failures.push('price-history trigger');
            if (failures.length) {
              throw new Error(`Post-migration verification failed: ${failures.join(', ')}.`);
            }

            console.log(`Migration ${target} verified successfully.`);
            console.log(`Price history rows: ${verification.open_history_rows}; active promotions: 0.`);
          } finally {
            await prisma.$disconnect();
          }
          NODE
