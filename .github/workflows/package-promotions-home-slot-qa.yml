name: Package promotions homepage-slot QA

on:
  push:
    branches:
      - feat/package-promotions

permissions:
  contents: write

jobs:
  verify-home-slot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_database?schema=public

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/package-promotions

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply targeted corrections
        run: |
          python3 scripts/package-promotions-home-slot-fix.py
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma contract
        run: |
          npx prisma validate
          npx prisma generate

      - name: Verify TypeScript on changed feature surfaces
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
          typecheck_status=${PIPESTATUS[0]}
          set -e
          TYPECHECK_STATUS="$typecheck_status" python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          changed.update(subprocess.check_output(
              ['git', 'ls-files', '--others', '--exclude-standard'],
              text=True,
          ).splitlines())
          pattern = re.compile(r'^(.+?)\(\d+,\d+\): error TS\d+:')
          feature_errors = []
          with open('/tmp/typecheck.log', encoding='utf-8', errors='replace') as handle:
              for raw_line in handle:
                  line = raw_line.rstrip('\n')
                  match = pattern.match(line)
                  if match and match.group(1) in changed:
                      feature_errors.append(line)

          print(f'Global typecheck exit: {os.environ.get("TYPECHECK_STATUS", "unknown")}')
          if feature_errors:
              print('TypeScript errors introduced on changed package-promotion files:')
              print('\n'.join(feature_errors))
              sys.exit(1)
          print('No TypeScript diagnostics were reported in changed package-promotion files.')
          PY

      - name: Run promotion unit tests
        run: node --import tsx --test tests/unit/package-promotions.test.ts

      - name: Remove one-off QA automation
        run: rm -f scripts/package-promotions-home-slot-fix.py .github/workflows/package-promotions-home-slot-qa.yml

      - name: Commit verified corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: align grouped event promotions across homepage and booking"
          git push origin HEAD:feat/package-promotions
