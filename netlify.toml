[build]
  command = "npm run build"
  base = "."

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  included_files = ["prisma/schema.prisma"]
  external_node_modules = [
    "@aws-sdk/client-s3",
    "@aws-sdk/lib-storage",
    "@prisma/client"
  ]

# Cache headers for static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
