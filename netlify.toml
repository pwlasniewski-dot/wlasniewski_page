[build]
  command = "npm run build"
  base = "."

# ─── ENVIRONMENT VARIABLES ───
# Set these in Netlify UI: Site settings → Environment variables
# Required variables:
#   - AWS_ACCESS_KEY_ID (or MY_AWS_ACCESS_KEY_ID)
#   - AWS_SECRET_ACCESS_KEY (or MY_AWS_SECRET_ACCESS_KEY)
#   - S3_BUCKET (default: wlasniewski-photo-storage)
#   - S3_REGION (default: eu-north-1)
#   - JWT_SECRET (32+ chars)
#   - NEXT_PUBLIC_BASE_URL
#   - DATABASE_URL

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  # CRITICAL: Include fonts and all necessary assets for PDF generation
  included_files = [
    "prisma/schema.prisma",
    "public/fonts/**"
  ]
  external_node_modules = [
    "@aws-sdk/client-s3",
    "@aws-sdk/lib-storage",
    "@prisma/client"
  ]

# Daily Analytics 2.0 business email. Netlify scheduled functions use UTC.
# Run at both possible UTC offsets; the function sends only when Warsaw local time is 08:00.
[functions."daily-analytics-report"]
  schedule = "0 6,7 * * *"

# Verify expired PayU orders before releasing booking slots. Age alone never
# releases a slot, which prevents a late COMPLETED webhook from double-booking.
[functions."cleanup-booking-payment-holds"]
  schedule = "*/15 * * * *"

# Cache headers for static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache for images
[[headers]]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    Vary = "Accept"

# Cache for public assets (fonts, icons, etc.)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# HTML pages - short cache with revalidation
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
